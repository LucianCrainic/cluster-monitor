<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Slurm Monitor</title>
  <desc id="desc">A terminal dashboard for monitoring Slurm clusters over OpenSSH.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b24"/>
      <stop offset="1" stop-color="#101512"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#50d6aa"/>
      <stop offset="1" stop-color="#a5e88b"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a9d9c0" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="#304239"/>

  <g transform="translate(52 54)">
    <rect width="480" height="212" rx="14" fill="#111914" stroke="#3b5244" stroke-width="2"/>
    <path d="M14 0h452a14 14 0 0 1 14 14v27H0V14A14 14 0 0 1 14 0Z" fill="#202b24"/>
    <circle cx="22" cy="21" r="5" fill="#e87969"/>
    <circle cx="41" cy="21" r="5" fill="#e7c36f"/>
    <circle cx="60" cy="21" r="5" fill="#68d69d"/>
    <text x="88" y="26" fill="#a3b3a6" font-family="monospace" font-size="14">cluster-monitor  ·  overview</text>
    <text x="22" y="69" fill="#e8efe8" font-family="monospace" font-size="15" font-weight="700">PARTITIONS</text>
    <text x="22" y="97" fill="#91a296" font-family="monospace" font-size="13">NAME        NODES     USED     IDLE</text>
    <text x="22" y="123" fill="#c9d7cb" font-family="monospace" font-size="14">compute        24      18        6</text>
    <text x="22" y="149" fill="#c9d7cb" font-family="monospace" font-size="14">gpu             8       5        3</text>
    <text x="22" y="181" fill="#e8efe8" font-family="monospace" font-size="15" font-weight="700">NODE ALLOCATION</text>
    <g transform="translate(22 190)">
      <rect width="15" height="10" rx="2" fill="#52d5a3"/><rect x="20" width="15" height="10" rx="2" fill="#52d5a3"/><rect x="40" width="15" height="10" rx="2" fill="#52d5a3"/><rect x="60" width="15" height="10" rx="2" fill="#dbb95f"/><rect x="80" width="15" height="10" rx="2" fill="#52d5a3"/><rect x="100" width="15" height="10" rx="2" fill="#536157"/><rect x="120" width="15" height="10" rx="2" fill="#536157"/><rect x="140" width="15" height="10" rx="2" fill="#52d5a3"/><rect x="160" width="15" height="10" rx="2" fill="#52d5a3"/><rect x="180" width="15" height="10" rx="2" fill="#536157"/>
    </g>
  </g>

  <g transform="translate(590 94)">
    <text x="0" y="0" fill="#eef5ee" font-family="system-ui, sans-serif" font-size="53" font-weight="750" letter-spacing="-2">Slurm Monitor</text>
    <rect x="0" y="23" width="94" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="0" y="69" fill="#b1c1b4" font-family="system-ui, sans-serif" font-size="21">A native terminal dashboard for Slurm clusters.</text>
    <text x="0" y="101" fill="#b1c1b4" font-family="system-ui, sans-serif" font-size="21">Read-only monitoring over your existing OpenSSH setup.</text>
    <g transform="translate(0 136)" font-family="monospace" font-size="14" font-weight="600">
      <rect width="120" height="34" rx="17" fill="#1a2c23" stroke="#3d614b"/><text x="60" y="22" text-anchor="middle" fill="#8ce0ae">LIVE QUEUE</text>
      <rect x="132" width="140" height="34" rx="17" fill="#1a2c23" stroke="#3d614b"/><text x="202" y="22" text-anchor="middle" fill="#8ce0ae">NODE HEALTH</text>
      <rect x="284" width="128" height="34" rx="17" fill="#1a2c23" stroke="#3d614b"/><text x="348" y="22" text-anchor="middle" fill="#8ce0ae">SSH NATIVE</text>
    </g>
  </g>
  <path d="M24 316h1152" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
</svg>
